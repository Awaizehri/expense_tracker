<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger | Add Transaction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header">
        <div class="header-division">
            <a href="index.html" class="site-logo">Ledger</a>
            <nav class="nav-bar">
                <div class="navbar-division">
                    <ul class="pages-list">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="add-transaction.html">Add Transaction</a></li>
                        <li><a href="transactions.html">Transactions</a></li>
                        <li><a href="login.html">Logout</a></li>
                    </ul>                 
                </div>
            </nav>
        </div>
    </header>
    <main>
        <h1>Make a Transaction.</h1>
        <form action="" id="add-transaction-form">
            <label for="transaction-type">Transaction Type:</label>
            <select name="transaction" id="transaction-type" required>
                <option value="" disabled selected>Transaction Type:</option>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
            </select>

            <label for="transaction-amount">Amount:</label>
            <input type="number" id="transaction-amount" name="amount" step="0.01" placeholder="0.00" required>

            <label for="transaction-category">Category:</label>
            <select name="category" id="transaction-category" required>
                <option value="" disabled selected>Select Category:</option>
                <option value="Food">Food</option>
                <option value="Garments">Garments</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Transportation">Transportation</option>
                <option value="Saving">Saving</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>     
            </select>

            <label for="transaction-date">Date:</label>
            <input type="date" id="transaction-date" name="date" required>

            <label for="transaction-description">Description: (Optional)</label>
            <textarea name="description" id="transaction-description" placeholder="What was this for?"></textarea>
            
            <button type="submit" class="submit-btn">Record Transaction</button>
        </form>
    </main>
    <footer>
        <div>
            <ul>
                <li>&copy;<span id="current-year"></span> Ledger</li>
                <li><a href="">Terms</a></li>
                <li><a href="">Privacy</a></li>
                <li><a href="">Cookies</a></li>
            </ul>
        </div>
    </footer>
    <script>document.getElementById("current-year").textContent = new Date().getFullYear();</script>
    <script src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger | Transaction History</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header">
            <a href="index.html" class="site-logo">Ledger</a>
            <nav>
                <ul class="pages-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="add-transaction.html">Add Transaction</a></li>
                    <li><a href="transactions.html">Transactions</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- Enabling search and filter functionality for transactions -->
    <main>
        <div class="table-container">
            <h1>Transaction History</h1>
            <div class="controls-container" style="display: flex; gap: 10px; margin-bottom: 20px;">
    <input type="text" id="search-bar" placeholder="Search category or description...">
    
    <select id="filter-type">
        <option value="All">All Types</option>
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
    </select>

    <select id="sort-type">
        <option value="date-new">Date (Newest First)</option>
        <option value="date-old">Date (Oldest First)</option>
        <option value="amount-high">Amount (High to Low)</option>
        <option value="amount-low">Amount (Low to High)</option>
    </select>
</div>
            <table class="transaction-table" border="1">
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Type</th>
                        <th scope="col">Category</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Description</th>
                        <th scope="col">Action</th> 
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    </tbody>
            </table>
        </div>
    </main> 
    <footer>
        <div>
            <ul>
                <li>&copy;<span id="current-year"></span> Ledger</li>
                <li><a href="">Terms</a></li>
                <li><a href="">Privacy</a></li>
                <li><a href="">Cookies</a></li>
            </ul>
        </div>
    </footer>
    <script>document.getElementById("current-year").textContent = new Date().getFullYear();</script>
    <script src="js/script.js"></script>
</body>
</html>
